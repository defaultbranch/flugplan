<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugplan</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        .panels {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .output-panel {
            margin-top: 16px;
        }

        .output-panels {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .panel {
            border: 1px solid #ccc;
            padding: 16px;
        }

        .field {
            margin-top: 12px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 6px;
        }

        .suggestions {
            background: #fff;
            border: 1px solid #ccc;
            display: none;
            left: 0;
            margin-top: 2px;
            max-height: 160px;
            overflow-y: auto;
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 1;
        }

        .suggestion {
            cursor: pointer;
            padding: 6px;
        }

        .suggestion.active,
        .suggestion:hover {
            background: #f2f2f2;
        }

        .output-map {
            border: 1px solid #ccc;
            height: 220px;
            width: 100%;
        }

        .output-profile {
            border: 1px solid #ccc;
            height: 240px;
            width: 100%;
        }

        .map-caption {
            color: #555;
            font-size: 0.9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Flugplan</h1>

    <div class="panels">
        <section class="panel">
            <h2>Departure</h2>

            <div class="field">
                <label for="departure-airport">Airport</label>
                <input id="departure-airport" name="departure-airport" type="text" autocomplete="off">
                <div id="departure-airport-suggestions" class="suggestions"></div>
            </div>

            <div class="field">
                <label for="departure-runway">Runway</label>
                <select id="departure-runway" name="departure-runway">
                    <option value="">Select runway</option>
                </select>
            </div>
        </section>

        <section class="panel">
            <h2>Arrival</h2>

            <div class="field">
                <label for="arrival-airport">Airport</label>
                <input id="arrival-airport" name="arrival-airport" type="text" autocomplete="off">
                <div id="arrival-airport-suggestions" class="suggestions"></div>
            </div>

            <div class="field">
                <label for="arrival-runway">Runway</label>
                <select id="arrival-runway" name="arrival-runway">
                    <option value="">Select runway</option>
                </select>
            </div>
        </section>

        <section class="panel">
            <h2>Airplane</h2>

            <div class="field">
                <label for="airplane">Airplane</label>
                <select id="airplane" name="airplane">
                    <option value="">Select airplane</option>
                </select>
            </div>

            <div class="field">
                <label for="cruise-altitude-feet-msl">Cruise Altitude (ft MSL)</label>
                <input id="cruise-altitude-feet-msl" name="cruise-altitude-feet-msl" type="number" min="0" step="100" inputmode="numeric">
            </div>
        </section>

        <section class="panel">
            <h2>VOR</h2>

            <div class="field">
                <label for="vor-station">Station</label>
                <input id="vor-station" name="vor-station" type="text" autocomplete="off">
                <div id="vor-station-suggestions" class="suggestions"></div>
            </div>
        </section>
    </div>

    <div class="output-panels">
        <section class="panel output-panel">
            <h2>Map</h2>

            <svg id="schematic-map" class="output-map" viewBox="0 0 360 220" aria-label="Schematic route map"></svg>
            <p class="map-caption" id="map-caption">Select departure and arrival airports to display them on the map.</p>
        </section>

        <section class="panel output-panel">
            <h2>Altitude Profile</h2>

            <svg id="altitude-profile" class="output-profile" viewBox="0 0 360 240" aria-label="Altitude over distance"></svg>
            <p class="map-caption" id="altitude-caption">Select departure, arrival, airplane, and cruise altitude to display altitude profile.</p>
        </section>
    </div>

    <script>
        const airports = [
            {
                code: 'LSMD',
                name: 'Dübendorf',
                latitude: 47.398602,
                longitude: 8.648230,
                altitudeFeetMsl: 1470,
                runways: [
                    { name: '11', orientationDeg: 108 },
                    { name: '29', orientationDeg: 288 },
                    { name: '11R', orientationDeg: 108 },
                    { name: '29L', orientationDeg: 288 }
                ]
            },
            {
                code: 'LSZF',
                name: 'Birrfeld',
                latitude: 47.443600,
                longitude: 8.233610,
                altitudeFeetMsl: 1300,
                runways: [
                    { name: '08L', orientationDeg: 80 },
                    { name: '26R', orientationDeg: 260 },
                    { name: '08R', orientationDeg: 80 },
                    { name: '26L', orientationDeg: 260 }
                ]
            },
            {
                code: 'LSZM',
                name: 'Mollis Airfield',
                latitude: 47.078353,
                longitude: 9.064662,
                altitudeFeetMsl: 1485,
                runways: [
                    { name: '01', orientationDeg: 13 },
                    { name: '19', orientationDeg: 193 }
                ]
            }
        ];

        const airplanes = [
            {
                name: 'Cessna 172P Skyhawk',
                nominalClimbRateFeetPerMinute: 500,
                climbSpeedKts: 75,
                nominalCruiseAltitudeFeetMsl: 5000,
                cruiseSpeedKts: 105,
                nominalDescentRateFeetPerMinute: -500,
                descentSpeedKts: 105
            }
        ];

        const vors = [
            { name: 'ZURICH EAST', code: 'ZUE', frequency: 110.05, latitude: 47.591944, longitude: 8.8175 },
            { name: 'KLOTEN', code: 'KLO', frequency: 114.85, latitude: 47.456944, longitude: 8.545556 },
            { name: 'WILLISAU', code: 'WIL', frequency: 116.90, latitude: 47.178056, longitude: 7.905833 }
        ];

        const airplaneSelect = document.getElementById('airplane');
        const cruiseAltitudeInput = document.getElementById('cruise-altitude-feet-msl');
        const departureRunwaySelect = document.getElementById('departure-runway');
        const arrivalRunwaySelect = document.getElementById('arrival-runway');
        const persistedControlIds = [
            'departure-airport',
            'departure-runway',
            'arrival-airport',
            'arrival-runway',
            'airplane',
            'cruise-altitude-feet-msl',
            'vor-station'
        ];
        const storageKeyPrefix = 'flugplan:';

        airplanes.forEach((airplane) => {
            const option = document.createElement('option');
            option.value = airplane.name;
            option.textContent = airplane.name;
            airplaneSelect.appendChild(option);
        });

        function getStorageKey(controlId) {
            return `${storageKeyPrefix}${controlId}`;
        }

        function saveControlValue(controlId, value) {
            try {
                window.localStorage.setItem(getStorageKey(controlId), value);
            } catch (error) {
                // Ignore storage failures so the page keeps working without persistence.
            }
        }

        function loadControlValue(controlId) {
            try {
                return window.localStorage.getItem(getStorageKey(controlId));
            } catch (error) {
                return null;
            }
        }

        function setSelectValueIfAvailable(selectElement, value) {
            if (!value) {
                selectElement.value = '';
                return;
            }

            const hasMatchingOption = Array.from(selectElement.options).some((option) => option.value === value);
            selectElement.value = hasMatchingOption ? value : '';
        }

        function persistCurrentControlValues() {
            persistedControlIds.forEach((controlId) => {
                const control = document.getElementById(controlId);
                saveControlValue(controlId, control.value);
            });
        }

        function restorePersistedState() {
            const departureAirportInput = document.getElementById('departure-airport');
            const arrivalAirportInput = document.getElementById('arrival-airport');
            const vorStationInput = document.getElementById('vor-station');
            const savedDepartureRunway = loadControlValue('departure-runway') || '';
            const savedArrivalRunway = loadControlValue('arrival-runway') || '';
            const savedCruiseAltitude = loadControlValue('cruise-altitude-feet-msl');

            departureAirportInput.value = loadControlValue('departure-airport') || '';
            arrivalAirportInput.value = loadControlValue('arrival-airport') || '';
            vorStationInput.value = loadControlValue('vor-station') || '';
            setSelectValueIfAvailable(airplaneSelect, loadControlValue('airplane') || '');
            cruiseAltitudeInput.value = savedCruiseAltitude || '';

            populateRunwaySelect('departure-airport', 'departure-runway', savedDepartureRunway);
            populateRunwaySelect('arrival-airport', 'arrival-runway', savedArrivalRunway);

            if (!savedCruiseAltitude) {
                applySelectedAirplaneCruiseAltitude();
            }

            persistCurrentControlValues();
        }

        function applySelectedAirplaneCruiseAltitude() {
            const airplane = findAirplane(airplaneSelect.value);
            cruiseAltitudeInput.value = airplane ? String(airplane.nominalCruiseAltitudeFeetMsl) : '';
            saveControlValue('cruise-altitude-feet-msl', cruiseAltitudeInput.value);
        }

        airplaneSelect.addEventListener('change', () => {
            applySelectedAirplaneCruiseAltitude();
            renderAltitudeProfile();
            saveControlValue('airplane', airplaneSelect.value);
        });

        cruiseAltitudeInput.addEventListener('input', () => {
            saveControlValue('cruise-altitude-feet-msl', cruiseAltitudeInput.value);
            renderAltitudeProfile();
        });

        departureRunwaySelect.addEventListener('change', () => {
            saveControlValue('departure-runway', departureRunwaySelect.value);
        });

        arrivalRunwaySelect.addEventListener('change', () => {
            saveControlValue('arrival-runway', arrivalRunwaySelect.value);
        });

        function formatAirport(airport) {
            return `${airport.code} - ${airport.name}`;
        }

        function formatVor(vor) {
            return `${vor.code} - ${vor.name}`;
        }

        function formatRunway(runway) {
            return `${runway.name} (${runway.orientationDeg} deg)`;
        }

        function findAirport(value) {
            const normalized = value.trim().toLowerCase();

            if (!normalized) {
                return null;
            }

            return airports.find((airport) => {
                const formatted = formatAirport(airport).toLowerCase();
                return airport.code.toLowerCase() === normalized
                    || airport.name.toLowerCase() === normalized
                    || formatted === normalized;
            }) || null;
        }

        function findVor(value) {
            const normalized = value.trim().toLowerCase();

            if (!normalized) {
                return null;
            }

            return vors.find((vor) => {
                const formatted = formatVor(vor).toLowerCase();
                return vor.code.toLowerCase() === normalized
                    || vor.name.toLowerCase() === normalized
                    || formatted === normalized;
            }) || null;
        }

        function findAirplane(value) {
            return airplanes.find((airplane) => airplane.name === value) || null;
        }

        function getSelectedCruiseAltitudeFeetMsl() {
            const airplane = findAirplane(airplaneSelect.value);
            const parsedValue = Number.parseInt(cruiseAltitudeInput.value, 10);

            if (Number.isFinite(parsedValue) && parsedValue >= 0) {
                return parsedValue;
            }

            return airplane ? airplane.nominalCruiseAltitudeFeetMsl : null;
        }

        function calculateDistanceMiles(fromAirport, toAirport) {
            const toRad = Math.PI / 180;
            const earthRadiusMiles = 3958.7613;
            const lat1 = fromAirport.latitude * toRad;
            const lon1 = fromAirport.longitude * toRad;
            const lat2 = toAirport.latitude * toRad;
            const lon2 = toAirport.longitude * toRad;
            const dLat = lat2 - lat1;
            const dLon = lon2 - lon1;
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return earthRadiusMiles * c;
        }

        function calculateInitialHeadingDegrees(fromAirport, toAirport) {
            const toRad = Math.PI / 180;
            const toDeg = 180 / Math.PI;
            const lat1 = fromAirport.latitude * toRad;
            const lat2 = toAirport.latitude * toRad;
            const dLon = (toAirport.longitude - fromAirport.longitude) * toRad;
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2)
                - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * toDeg;
            return (bearing + 360) % 360;
        }

        function headingToCardinal(headingDeg) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(headingDeg / 45) % 8;
            return directions[index];
        }

        function renderAltitudeProfile() {
            const profile = document.getElementById('altitude-profile');
            const caption = document.getElementById('altitude-caption');
            const departure = findAirport(document.getElementById('departure-airport').value);
            const arrival = findAirport(document.getElementById('arrival-airport').value);
            const airplane = findAirplane(airplaneSelect.value);
            const selectedCruiseAltitudeFeetMsl = getSelectedCruiseAltitudeFeetMsl();

            while (profile.firstChild) {
                profile.removeChild(profile.firstChild);
            }

            const width = 360;
            const height = 240;
            const marginLeft = 42;
            const marginRight = 14;
            const marginTop = 16;
            const marginBottom = 32;
            const plotWidth = width - marginLeft - marginRight;
            const plotHeight = height - marginTop - marginBottom;

            function createSvgElement(name) {
                return document.createElementNS('http://www.w3.org/2000/svg', name);
            }

            const background = createSvgElement('rect');
            background.setAttribute('x', '0');
            background.setAttribute('y', '0');
            background.setAttribute('width', String(width));
            background.setAttribute('height', String(height));
            background.setAttribute('fill', '#fafafa');
            profile.appendChild(background);

            if (!departure || !arrival || !airplane || selectedCruiseAltitudeFeetMsl === null) {
                caption.textContent = 'Select departure, arrival, airplane, and cruise altitude to display altitude profile.';
                return;
            }

            const totalDistanceMiles = calculateDistanceMiles(departure, arrival);
            const climbRate = airplane.nominalClimbRateFeetPerMinute;
            const descentRate = Math.abs(airplane.nominalDescentRateFeetPerMinute);
            const targetCruiseAltitude = Math.max(
                selectedCruiseAltitudeFeetMsl,
                departure.altitudeFeetMsl,
                arrival.altitudeFeetMsl
            );

            const climbDelta = Math.max(0, targetCruiseAltitude - departure.altitudeFeetMsl);
            const descentDelta = Math.max(0, targetCruiseAltitude - arrival.altitudeFeetMsl);
            const climbMinutes = climbRate > 0 ? climbDelta / climbRate : 0;
            const descentMinutes = descentRate > 0 ? descentDelta / descentRate : 0;
            const climbSpeedMph = airplane.climbSpeedKts * 1.15078;
            const descentSpeedMph = airplane.descentSpeedKts * 1.15078;
            let climbDistance = (climbMinutes / 60) * climbSpeedMph;
            let descentDistance = (descentMinutes / 60) * descentSpeedMph;

            const nonCruiseDistance = climbDistance + descentDistance;
            if (nonCruiseDistance > 0 && nonCruiseDistance > totalDistanceMiles) {
                const factor = totalDistanceMiles / nonCruiseDistance;
                climbDistance *= factor;
                descentDistance *= factor;
            }

            const climbEndMiles = Math.max(0, Math.min(totalDistanceMiles, climbDistance));
            const descentStartMiles = Math.max(climbEndMiles, totalDistanceMiles - descentDistance);

            const minAltitude = Math.min(departure.altitudeFeetMsl, arrival.altitudeFeetMsl);
            const maxAltitude = Math.max(targetCruiseAltitude, departure.altitudeFeetMsl, arrival.altitudeFeetMsl);
            const altitudePadding = Math.max(300, (maxAltitude - minAltitude) * 0.1);
            const yMin = Math.max(0, minAltitude - altitudePadding);
            const yMax = maxAltitude + altitudePadding;

            function xToPixel(miles) {
                const safeDistance = Math.max(totalDistanceMiles, 1);
                return marginLeft + (miles / safeDistance) * plotWidth;
            }

            function yToPixel(altitudeFeet) {
                return marginTop + ((yMax - altitudeFeet) / (yMax - yMin || 1)) * plotHeight;
            }

            const axisX = createSvgElement('line');
            axisX.setAttribute('x1', String(marginLeft));
            axisX.setAttribute('y1', String(height - marginBottom));
            axisX.setAttribute('x2', String(width - marginRight));
            axisX.setAttribute('y2', String(height - marginBottom));
            axisX.setAttribute('stroke', '#444');
            profile.appendChild(axisX);

            const axisY = createSvgElement('line');
            axisY.setAttribute('x1', String(marginLeft));
            axisY.setAttribute('y1', String(marginTop));
            axisY.setAttribute('x2', String(marginLeft));
            axisY.setAttribute('y2', String(height - marginBottom));
            axisY.setAttribute('stroke', '#444');
            profile.appendChild(axisY);

            const profileLine = createSvgElement('polyline');
            const points = [
                `${xToPixel(0)},${yToPixel(departure.altitudeFeetMsl)}`,
                `${xToPixel(climbEndMiles)},${yToPixel(targetCruiseAltitude)}`,
                `${xToPixel(descentStartMiles)},${yToPixel(targetCruiseAltitude)}`,
                `${xToPixel(totalDistanceMiles)},${yToPixel(arrival.altitudeFeetMsl)}`
            ].join(' ');
            profileLine.setAttribute('points', points);
            profileLine.setAttribute('fill', 'none');
            profileLine.setAttribute('stroke', '#0a66c2');
            profileLine.setAttribute('stroke-width', '2.5');
            profile.appendChild(profileLine);

            const climbBar = createSvgElement('line');
            climbBar.setAttribute('x1', String(xToPixel(climbEndMiles)));
            climbBar.setAttribute('y1', String(marginTop));
            climbBar.setAttribute('x2', String(xToPixel(climbEndMiles)));
            climbBar.setAttribute('y2', String(height - marginBottom));
            climbBar.setAttribute('stroke', '#1b9e77');
            climbBar.setAttribute('stroke-dasharray', '4 3');
            profile.appendChild(climbBar);

            const descentBar = createSvgElement('line');
            descentBar.setAttribute('x1', String(xToPixel(descentStartMiles)));
            descentBar.setAttribute('y1', String(marginTop));
            descentBar.setAttribute('x2', String(xToPixel(descentStartMiles)));
            descentBar.setAttribute('y2', String(height - marginBottom));
            descentBar.setAttribute('stroke', '#d95f02');
            descentBar.setAttribute('stroke-dasharray', '4 3');
            profile.appendChild(descentBar);

            const climbTick = createSvgElement('line');
            climbTick.setAttribute('x1', String(xToPixel(climbEndMiles)));
            climbTick.setAttribute('y1', String(height - marginBottom));
            climbTick.setAttribute('x2', String(xToPixel(climbEndMiles)));
            climbTick.setAttribute('y2', String(height - marginBottom + 8));
            climbTick.setAttribute('stroke', '#1b9e77');
            climbTick.setAttribute('stroke-width', '2');
            profile.appendChild(climbTick);

            const descentTick = createSvgElement('line');
            descentTick.setAttribute('x1', String(xToPixel(descentStartMiles)));
            descentTick.setAttribute('y1', String(height - marginBottom));
            descentTick.setAttribute('x2', String(xToPixel(descentStartMiles)));
            descentTick.setAttribute('y2', String(height - marginBottom + 8));
            descentTick.setAttribute('stroke', '#d95f02');
            descentTick.setAttribute('stroke-width', '2');
            profile.appendChild(descentTick);

            const labels = [
                { text: '0 mi', x: xToPixel(0), y: height - 10 },
                { text: `${totalDistanceMiles.toFixed(1)} mi`, x: xToPixel(totalDistanceMiles), y: height - 10 },
                { text: `${Math.round(yMin)} ft`, x: 6, y: yToPixel(yMin) + 4 },
                { text: `${Math.round(yMax)} ft`, x: 6, y: yToPixel(yMax) + 4 }
            ];

            labels.forEach((labelData) => {
                const label = createSvgElement('text');
                label.setAttribute('x', String(labelData.x));
                label.setAttribute('y', String(labelData.y));
                label.setAttribute('font-size', '10');
                label.setAttribute('fill', '#333');
                label.textContent = labelData.text;
                profile.appendChild(label);
            });

            caption.textContent = `${departure.code} to ${arrival.code}: ${totalDistanceMiles.toFixed(1)} miles. Cruise ${Math.round(targetCruiseAltitude)} ft MSL.`;
        }

        function renderSchematicMap() {
            const map = document.getElementById('schematic-map');
            const caption = document.getElementById('map-caption');
            const departure = findAirport(document.getElementById('departure-airport').value);
            const arrival = findAirport(document.getElementById('arrival-airport').value);
            const selectedVor = findVor(document.getElementById('vor-station').value);

            while (map.firstChild) {
                map.removeChild(map.firstChild);
            }

            const width = 360;
            const height = 220;
            const margin = 26;
            const mapPoints = airports.concat(vors);
            const latitudes = mapPoints.map((point) => point.latitude);
            const longitudes = mapPoints.map((point) => point.longitude);
            const minLat = Math.min(...latitudes);
            const maxLat = Math.max(...latitudes);
            const minLon = Math.min(...longitudes);
            const maxLon = Math.max(...longitudes);

            function createSvgElement(name) {
                return document.createElementNS('http://www.w3.org/2000/svg', name);
            }

            function project(point) {
                const lonRange = maxLon - minLon || 1;
                const latRange = maxLat - minLat || 1;
                const x = margin + ((point.longitude - minLon) / lonRange) * (width - margin * 2);
                const y = height - margin - ((point.latitude - minLat) / latRange) * (height - margin * 2);
                return { x, y };
            }

            const background = createSvgElement('rect');
            background.setAttribute('x', '0');
            background.setAttribute('y', '0');
            background.setAttribute('width', String(width));
            background.setAttribute('height', String(height));
            background.setAttribute('fill', '#fafafa');
            map.appendChild(background);

            const selectedAirports = [departure, arrival].filter(Boolean);

            if (selectedAirports.length === 0 && !selectedVor) {
                caption.textContent = 'Select departure, arrival, or a VOR station to display them on the map.';
                return;
            }

            if (departure && arrival) {
                const start = project(departure);
                const end = project(arrival);
                const route = createSvgElement('line');
                route.setAttribute('x1', String(start.x));
                route.setAttribute('y1', String(start.y));
                route.setAttribute('x2', String(end.x));
                route.setAttribute('y2', String(end.y));
                route.setAttribute('stroke', '#6b7280');
                route.setAttribute('stroke-width', '2');
                map.appendChild(route);
            }

            selectedAirports.forEach((airport, index) => {
                const point = project(airport);
                const color = index === 0 && departure === airport ? '#0b7' : '#06c';

                const marker = createSvgElement('circle');
                marker.setAttribute('cx', String(point.x));
                marker.setAttribute('cy', String(point.y));
                marker.setAttribute('r', '5');
                marker.setAttribute('fill', color);
                map.appendChild(marker);

                const label = createSvgElement('text');
                label.setAttribute('x', String(point.x + 8));
                label.setAttribute('y', String(point.y - 8));
                label.setAttribute('font-size', '11');
                label.setAttribute('fill', '#222');
                label.textContent = airport.code;
                map.appendChild(label);
            });

            if (selectedVor) {
                const point = project(selectedVor);

                const marker = createSvgElement('rect');
                marker.setAttribute('x', String(point.x - 4));
                marker.setAttribute('y', String(point.y - 4));
                marker.setAttribute('width', '8');
                marker.setAttribute('height', '8');
                marker.setAttribute('fill', '#b22222');
                map.appendChild(marker);

                const label = createSvgElement('text');
                label.setAttribute('x', String(point.x + 8));
                label.setAttribute('y', String(point.y + 12));
                label.setAttribute('font-size', '11');
                label.setAttribute('fill', '#222');
                label.textContent = selectedVor.code;
                map.appendChild(label);
            }

            if (departure && arrival && selectedVor) {
                const heading = calculateInitialHeadingDegrees(departure, arrival);
                const headingRounded = Math.round(heading);
                const cardinal = headingToCardinal(heading);
                caption.textContent = `Route ${departure.code} -> ${arrival.code}. Heading ${headingRounded} deg (${cardinal}). VOR ${selectedVor.code} highlighted.`;
                return;
            }

            if (departure && arrival) {
                const heading = calculateInitialHeadingDegrees(departure, arrival);
                const headingRounded = Math.round(heading);
                const cardinal = headingToCardinal(heading);
                caption.textContent = `Route ${departure.code} -> ${arrival.code}. Heading ${headingRounded} deg (${cardinal}).`;
                return;
            }

            if (selectedVor && departure) {
                caption.textContent = `Departure ${departure.code} shown with VOR ${selectedVor.code}. Select an arrival airport to complete the route.`;
                return;
            }

            if (selectedVor && arrival) {
                caption.textContent = `Arrival ${arrival.code} shown with VOR ${selectedVor.code}. Select a departure airport to complete the route.`;
                return;
            }

            if (selectedVor) {
                caption.textContent = `VOR ${selectedVor.code} shown. Select departure and arrival airports to display the route.`;
                return;
            }

            if (departure) {
                caption.textContent = `Departure ${departure.code} shown. Select an arrival airport to complete the route.`;
                return;
            }

            caption.textContent = `Arrival ${arrival.code} shown. Select a departure airport to complete the route.`;
        }

        function populateRunwaySelect(airportInputId, runwaySelectId, preferredRunwayValue = null) {
            const airportInput = document.getElementById(airportInputId);
            const runwaySelect = document.getElementById(runwaySelectId);
            const airport = findAirport(airportInput.value);
            const runwayValueToRestore = preferredRunwayValue !== null ? preferredRunwayValue : runwaySelect.value;

            runwaySelect.innerHTML = '';

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select runway';
            runwaySelect.appendChild(placeholder);

            if (!airport) {
                runwaySelect.value = '';
                saveControlValue(runwaySelectId, runwaySelect.value);
                return;
            }

            airport.runways.forEach((runway) => {
                const option = document.createElement('option');
                option.value = runway.name;
                option.textContent = formatRunway(runway);
                runwaySelect.appendChild(option);
            });

            setSelectValueIfAvailable(runwaySelect, runwayValueToRestore);
            saveControlValue(runwaySelectId, runwaySelect.value);
        }

        function setupAutocomplete(config) {
            const {
                inputId,
                suggestionsId,
                items,
                formatItem,
                matchesQuery,
                onSelect,
                onInput
            } = config;
            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionsId);
            let activeIndex = -1;

            function getOptions() {
                return Array.from(suggestions.querySelectorAll('.suggestion'));
            }

            function setActiveOption(index) {
                const options = getOptions();

                options.forEach((option, optionIndex) => {
                    option.classList.toggle('active', optionIndex === index);
                });

                activeIndex = index;

                if (activeIndex >= 0 && options[activeIndex]) {
                    options[activeIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            function selectItem(item) {
                input.value = formatItem(item);
                hideSuggestions();
                saveControlValue(inputId, input.value);
                onSelect(item);
            }

            function hideSuggestions() {
                suggestions.style.display = 'none';
                suggestions.innerHTML = '';
                activeIndex = -1;
            }

            function showSuggestions(query) {
                const normalizedQuery = query.trim().toLowerCase();

                if (!normalizedQuery) {
                    hideSuggestions();
                    return;
                }

                const matches = items.filter((item) => matchesQuery(item, normalizedQuery));

                if (matches.length === 0) {
                    hideSuggestions();
                    return;
                }

                suggestions.innerHTML = '';
                activeIndex = -1;

                matches.forEach((item) => {
                    const option = document.createElement('div');
                    option.className = 'suggestion';
                    option.textContent = formatItem(item);
                    option.addEventListener('mousedown', () => {
                        selectItem(item);
                    });
                    suggestions.appendChild(option);
                });

                suggestions.style.display = 'block';
            }

            input.addEventListener('input', () => {
                showSuggestions(input.value);
                saveControlValue(inputId, input.value);
                onInput();
            });

            input.addEventListener('focus', () => {
                showSuggestions(input.value);
            });

            input.addEventListener('keydown', (event) => {
                const options = getOptions();

                if (options.length === 0) {
                    return;
                }

                if (event.key === 'ArrowDown') {
                    event.preventDefault();

                    const nextIndex = activeIndex < options.length - 1 ? activeIndex + 1 : 0;
                    setActiveOption(nextIndex);
                    return;
                }

                if (event.key === 'ArrowUp') {
                    event.preventDefault();

                    const nextIndex = activeIndex > 0 ? activeIndex - 1 : options.length - 1;
                    setActiveOption(nextIndex);
                    return;
                }

                if (event.key === 'Enter' && activeIndex >= 0) {
                    event.preventDefault();
                    options[activeIndex].dispatchEvent(new MouseEvent('mousedown'));
                    return;
                }

                if (event.key === 'Escape') {
                    hideSuggestions();
                }
            });

            input.addEventListener('blur', () => {
                window.setTimeout(hideSuggestions, 100);
            });
        }

        setupAutocomplete({
            inputId: 'departure-airport',
            suggestionsId: 'departure-airport-suggestions',
            items: airports,
            formatItem: formatAirport,
            matchesQuery: (airport, normalizedQuery) => {
                return airport.code.toLowerCase().includes(normalizedQuery)
                    || airport.name.toLowerCase().includes(normalizedQuery);
            },
            onSelect: () => {
                populateRunwaySelect('departure-airport', 'departure-runway');
                renderSchematicMap();
                renderAltitudeProfile();
            },
            onInput: () => {
                populateRunwaySelect('departure-airport', 'departure-runway');
                renderSchematicMap();
                renderAltitudeProfile();
            }
        });

        setupAutocomplete({
            inputId: 'arrival-airport',
            suggestionsId: 'arrival-airport-suggestions',
            items: airports,
            formatItem: formatAirport,
            matchesQuery: (airport, normalizedQuery) => {
                return airport.code.toLowerCase().includes(normalizedQuery)
                    || airport.name.toLowerCase().includes(normalizedQuery);
            },
            onSelect: () => {
                populateRunwaySelect('arrival-airport', 'arrival-runway');
                renderSchematicMap();
                renderAltitudeProfile();
            },
            onInput: () => {
                populateRunwaySelect('arrival-airport', 'arrival-runway');
                renderSchematicMap();
                renderAltitudeProfile();
            }
        });

        setupAutocomplete({
            inputId: 'vor-station',
            suggestionsId: 'vor-station-suggestions',
            items: vors,
            formatItem: formatVor,
            matchesQuery: (vor, normalizedQuery) => {
                return vor.code.toLowerCase().includes(normalizedQuery)
                    || vor.name.toLowerCase().includes(normalizedQuery);
            },
            onSelect: () => {
                renderSchematicMap();
            },
            onInput: () => {
                renderSchematicMap();
            }
        });

        restorePersistedState();
        renderSchematicMap();
        renderAltitudeProfile();
    </script>
</body>
</html>
