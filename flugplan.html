<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugplan</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        .panels {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .panel {
            border: 1px solid #ccc;
            padding: 16px;
        }

        .field {
            margin-top: 12px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 6px;
        }

        .suggestions {
            background: #fff;
            border: 1px solid #ccc;
            display: none;
            left: 0;
            margin-top: 2px;
            max-height: 160px;
            overflow-y: auto;
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 1;
        }

        .suggestion {
            cursor: pointer;
            padding: 6px;
        }

        .suggestion.active,
        .suggestion:hover {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Flugplan</h1>

    <div class="panels">
        <section class="panel">
            <h2>Departure</h2>

            <div class="field">
                <label for="departure-airport">Airport</label>
                <input id="departure-airport" name="departure-airport" type="text" autocomplete="off">
                <div id="departure-airport-suggestions" class="suggestions"></div>
            </div>

            <div class="field">
                <label for="departure-runway">Runway</label>
                <select id="departure-runway" name="departure-runway">
                    <option value="">Select runway</option>
                </select>
            </div>
        </section>

        <section class="panel">
            <h2>Arrival</h2>

            <div class="field">
                <label for="arrival-airport">Airport</label>
                <input id="arrival-airport" name="arrival-airport" type="text" autocomplete="off">
                <div id="arrival-airport-suggestions" class="suggestions"></div>
            </div>

            <div class="field">
                <label for="arrival-runway">Runway</label>
                <select id="arrival-runway" name="arrival-runway">
                    <option value="">Select runway</option>
                </select>
            </div>
        </section>

        <section class="panel">
            <h2>Airplane</h2>

            <div class="field">
                <label for="airplane">Airplane</label>
                <select id="airplane" name="airplane">
                    <option value="">Select airplane</option>
                </select>
            </div>
        </section>
    </div>

    <script>
        const airports = [
            {
                code: 'LSMD',
                name: 'Dübendorf',
                latitude: 47.398602,
                longitude: 8.648230,
                altitudeFeetMsl: 1470,
                runways: [
                    { name: '11', orientationDeg: 108 },
                    { name: '29', orientationDeg: 288 },
                    { name: '11R', orientationDeg: 108 },
                    { name: '29L', orientationDeg: 288 }
                ]
            },
            {
                code: 'LSZF',
                name: 'Birrfeld',
                latitude: 47.443600,
                longitude: 8.233610,
                altitudeFeetMsl: 1300,
                runways: [
                    { name: '08L', orientationDeg: 80 },
                    { name: '26R', orientationDeg: 260 },
                    { name: '08R', orientationDeg: 80 },
                    { name: '26L', orientationDeg: 260 }
                ]
            },
            {
                code: 'LSZM',
                name: 'Mollis Airfield',
                latitude: 47.078353,
                longitude: 9.064662,
                altitudeFeetMsl: 1485,
                runways: [
                    { name: '01', orientationDeg: 13 },
                    { name: '19', orientationDeg: 193 }
                ]
            }
        ];

        const airplanes = [
            {
                name: 'Cessna 172P Skyhawk',
                nominalClimbRateFeetPerMinute: 500,
                climbSpeedKts: 75,
                cruiseSpeedKts: 105,
                nominalDescentRateFeetPerMinute: -500,
                descentSpeedKts: 105
            }
        ];

        const airplaneSelect = document.getElementById('airplane');

        airplanes.forEach((airplane) => {
            const option = document.createElement('option');
            option.value = airplane.name;
            option.textContent = airplane.name;
            airplaneSelect.appendChild(option);
        });

        function formatAirport(airport) {
            return `${airport.code} - ${airport.name}`;
        }

        function formatRunway(runway) {
            return `${runway.name} (${runway.orientationDeg} deg)`;
        }

        function findAirport(value) {
            const normalized = value.trim().toLowerCase();

            if (!normalized) {
                return null;
            }

            return airports.find((airport) => {
                const formatted = formatAirport(airport).toLowerCase();
                return airport.code.toLowerCase() === normalized
                    || airport.name.toLowerCase() === normalized
                    || formatted === normalized;
            }) || null;
        }

        function populateRunwaySelect(airportInputId, runwaySelectId) {
            const airportInput = document.getElementById(airportInputId);
            const runwaySelect = document.getElementById(runwaySelectId);
            const airport = findAirport(airportInput.value);

            runwaySelect.innerHTML = '';

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select runway';
            runwaySelect.appendChild(placeholder);

            if (!airport) {
                return;
            }

            airport.runways.forEach((runway) => {
                const option = document.createElement('option');
                option.value = runway.name;
                option.textContent = formatRunway(runway);
                runwaySelect.appendChild(option);
            });
        }

        function setupAirportAutocomplete(inputId, suggestionsId) {
            const input = document.getElementById(inputId);
            const suggestions = document.getElementById(suggestionsId);
            let activeIndex = -1;

            function getOptions() {
                return Array.from(suggestions.querySelectorAll('.suggestion'));
            }

            function setActiveOption(index) {
                const options = getOptions();

                options.forEach((option, optionIndex) => {
                    option.classList.toggle('active', optionIndex === index);
                });

                activeIndex = index;

                if (activeIndex >= 0 && options[activeIndex]) {
                    options[activeIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            function selectAirport(airport) {
                input.value = formatAirport(airport);
                hideSuggestions();

                if (input.id === 'departure-airport') {
                    populateRunwaySelect('departure-airport', 'departure-runway');
                }

                if (input.id === 'arrival-airport') {
                    populateRunwaySelect('arrival-airport', 'arrival-runway');
                }
            }

            function hideSuggestions() {
                suggestions.style.display = 'none';
                suggestions.innerHTML = '';
                activeIndex = -1;
            }

            function showSuggestions(query) {
                const normalizedQuery = query.trim().toLowerCase();

                if (!normalizedQuery) {
                    hideSuggestions();
                    return;
                }

                const matches = airports.filter((airport) => {
                    return airport.code.toLowerCase().includes(normalizedQuery)
                        || airport.name.toLowerCase().includes(normalizedQuery);
                });

                if (matches.length === 0) {
                    hideSuggestions();
                    return;
                }

                suggestions.innerHTML = '';
                activeIndex = -1;

                matches.forEach((airport) => {
                    const option = document.createElement('div');
                    option.className = 'suggestion';
                    option.textContent = formatAirport(airport);
                    option.addEventListener('mousedown', () => {
                        selectAirport(airport);
                    });
                    suggestions.appendChild(option);
                });

                suggestions.style.display = 'block';
            }

            input.addEventListener('input', () => {
                showSuggestions(input.value);

                if (input.id === 'departure-airport') {
                    populateRunwaySelect('departure-airport', 'departure-runway');
                }

                if (input.id === 'arrival-airport') {
                    populateRunwaySelect('arrival-airport', 'arrival-runway');
                }
            });

            input.addEventListener('focus', () => {
                showSuggestions(input.value);
            });

            input.addEventListener('keydown', (event) => {
                const options = getOptions();

                if (options.length === 0) {
                    return;
                }

                if (event.key === 'ArrowDown') {
                    event.preventDefault();

                    const nextIndex = activeIndex < options.length - 1 ? activeIndex + 1 : 0;
                    setActiveOption(nextIndex);
                    return;
                }

                if (event.key === 'ArrowUp') {
                    event.preventDefault();

                    const nextIndex = activeIndex > 0 ? activeIndex - 1 : options.length - 1;
                    setActiveOption(nextIndex);
                    return;
                }

                if (event.key === 'Enter' && activeIndex >= 0) {
                    event.preventDefault();
                    options[activeIndex].dispatchEvent(new MouseEvent('mousedown'));
                    return;
                }

                if (event.key === 'Escape') {
                    hideSuggestions();
                }
            });

            input.addEventListener('blur', () => {
                window.setTimeout(hideSuggestions, 100);
            });
        }

        setupAirportAutocomplete('departure-airport', 'departure-airport-suggestions');
        setupAirportAutocomplete('arrival-airport', 'arrival-airport-suggestions');

        populateRunwaySelect('departure-airport', 'departure-runway');
        populateRunwaySelect('arrival-airport', 'arrival-runway');

        // VOR Stations
        const vors = [
            { name: 'ZURICH EAST', code: 'ZUE', frequency: 110.05, latitude: 47.591944, longitude: 8.8175 },
            { name: 'KLOTEN', code: 'KLO', frequency: 114.85, latitude: 47.456944, longitude: 8.545556 },
            { name: 'WILLISAU', code: 'WIL', frequency: 116.90, latitude: 47.178056, longitude: 7.905833 }
        ];
    </script>
</body>
</html>
